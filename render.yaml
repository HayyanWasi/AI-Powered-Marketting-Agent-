services:
  - type: web
    name: ai-marketing-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /docs
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GROK_API_KEY
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_AI_TOKEN
        sync: false
      - key: CLOUDFLARE_IMG2IMG_MODEL
        value: "@cf/runwayml/stable-diffusion-v1-5-img2img"
      - key: CLOUDFLARE_TEXT2IMG_MODEL
        value: "@cf/black-forest-labs/flux-1-schnell"
      - key: LOG_LEVEL
        value: "INFO"
      - key: SESSION_TIMEOUT_HOURS
        value: "24"
      - key: DDGS_TIMEOUT_SECONDS
        value: "15"
      - key: DDGS_RATE_LIMIT_SECONDS
        value: "5"
